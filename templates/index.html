<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Dashboard</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Card */
        .container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            margin-bottom: 0.5rem;
            margin-top: 1.5rem;
        }

        /* Value Display */
        h1 {
            font-size: 2.5rem;
            margin: 0;
            color: #2c3e50;
        }

        #value {
            color: #3498db;
            /* Blue color for the main value */
            font-weight: 800;
        }

        #type {
            font-weight: 600;
            color: #27ae60;
            /* Green color for type */
        }

        /* List Styling */
        #dress {
            list-style: none;
            padding: 0;
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        #dress li {
            background: #ecf0f1;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #34495e;
            border: 1px solid #dcdde1;
        }

        /* Simple Animation for updates */
        #value,
        #type {
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Sensor Value</h2>
        <h1 id="value">0</h1>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <h2>Type</h2>
        <h1 id="type">None</h1>

        <h2>Dress List</h2>
        <ul id="dress"></ul>
    </div>

    <script>
        function load() {
            fetch("/data")
                .then(res => res.json())
                .then(data => {
                    console.log(data);
                    document.getElementById("value").innerText = data.value;
                    document.getElementById("type").innerText = data.type;

                    let list = document.getElementById("dress");
                    list.innerHTML = "";

                    data.dress.forEach(d => {
                        let li = document.createElement("li");
                        li.innerText = d;
                        list.appendChild(li);
                    });
                })
                .catch(err => console.error("Error fetching data:", err));
        }

        setInterval(load, 500);
        // Initial load
        load();
    </script>

</body>

</html>
